:concurrency: 5
:queues:
  - default
  - mailers
:schedule:
  hackatime_sync:
    cron: "*/2 * * * *"
    class: "HackatimeBatchSyncJob"
    active_job: true
    queue: default
    description: "Sync Hackatime hours for all non-shipped projects every 2 minutes"
  airtable_sync:
    cron: "*/5 * * * *"
    class: "AirtableSyncJob"
    active_job: true
    queue: default
    description: "Sync shipped projects to Airtable every 5 minutes"
  hackatime_ban_sync:
    cron: "*/10 * * * *"
    class: "HackatimeBanSyncJob"
    active_job: true
    queue: default
    description: "Refresh cached Hackatime ban flags for a batch of users"
